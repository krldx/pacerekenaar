<html lang="de">
<head>
<meta charset="utf-8">

<title>Pacerechner Mallorca by UTMB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.css">
<script type="module">
// MapLibre 6 ist ESM-only und würde seinen Worker von der CDN-Adresse laden (fremder Ursprung, für Worker nicht erlaubt):
// Worker-Code holen und als klassischen Worker aus einer Blob-URL starten (wie im GPS-Projekt)
const V="https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/";
const [ml,code]=await Promise.all([import(V+"maplibre-gl.mjs"),fetch(V+"maplibre-gl-worker.mjs").then(r=>r.text())]);
ml.setWorkerUrl(URL.createObjectURL(new Blob([code.replace(/export\s*\{[^}]*\};?\s*(\/\/# sourceMappingURL=\S*)?\s*$/,"")],{type:"text/javascript"}))+"#.cjs");
window.maplibregl=ml;window.dispatchEvent(new Event("maplibre-ready"));
</script>
<style>
/* Layout: Arbeitsblatt – Streckenwahl & Sprache, je Strecke ein Zielzeit-Regler, gemeinsames Zeit-Distanz-Diagramm mit Pace-Streifen, Karte, Tabellen je Strecke */
:root{
  --bg:#f7f7f4; --panel:#ffffff; --fg:#151714; --fg2:#53564f; --muted:#8a8d85; --grid:#e3e4de; --line:#c9cbc3;
  --fast:#2a78d6; --cut:#eb6834; --plan:#0f8a5f; --elev:#b9bcb2; --night:#24345e; --nightop:.13; --sun:#b7791f; --support:#7b3fc4;
  --c-sdt:#0f8a5f; --c-etm:#c13584; --warn:#c2410c; --ok:#0f7a52;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141613; --panel:#1c1f1b; --fg:#eeefe9; --fg2:#bfc2b8; --muted:#8d9088; --grid:#2c302a; --line:#3d4239;
  --fast:#4f95ea; --cut:#f07a4a; --plan:#2fbf86; --elev:#4a4f46; --night:#7f9be0; --nightop:.10; --sun:#e0a84a; --support:#b48cf0;
  --c-sdt:#2fbf86; --c-etm:#e66aaa; --warn:#fb923c; --ok:#34d399; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141613; --panel:#1c1f1b; --fg:#eeefe9; --fg2:#bfc2b8; --muted:#8d9088; --grid:#2c302a; --line:#3d4239;
  --fast:#4f95ea; --cut:#f07a4a; --plan:#2fbf86; --elev:#4a4f46; --night:#7f9be0; --nightop:.10; --sun:#e0a84a; --support:#b48cf0;
  --c-sdt:#2fbf86; --c-etm:#e66aaa; --warn:#fb923c; --ok:#34d399; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;align-items:flex-start}
header>div{min-width:0;flex:1 1 420px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4vw,40px);letter-spacing:.01em;margin:0;line-height:1.05;text-wrap:balance}
.sub{color:var(--fg2);margin:4px 0 0;max-width:70ch}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--grid);border-radius:10px;padding:16px 18px;min-width:0}
/* Sprache */
.lang{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:13px;font-weight:600}
.lang span{color:var(--muted)} .lang span.on{color:var(--fg)}
.switch{position:relative;width:46px;height:26px;border-radius:13px;border:1px solid var(--line);background:var(--grid);cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch[aria-checked="true"]::after{left:22px}
.switch:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
/* Streckenwahl */
.courses{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center}
.courses label{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.courses input{width:18px;height:18px;accent-color:var(--fg)}
.cdot{display:inline-block;width:12px;height:12px;border-radius:3px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:20px}
.control{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 24px;align-items:center;align-content:start;border-top:4px solid var(--cc)}
.control h2{grid-column:1/-1;font-family:var(--f-display);font-weight:700;font-size:22px;margin:0}
.control h2 small{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400;margin-left:8px;letter-spacing:.04em}
.control label.gl{font-weight:600}
.goal{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;color:var(--cc)}
.goalBox{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.goalIn{font:inherit;color:inherit;width:3.4em;text-align:right;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:2px 6px;font-variant-numeric:tabular-nums}
.goalIn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.goalSteps{display:flex;gap:6px}
.goal small{font-size:17px;color:var(--fg2);font-weight:600;margin-left:6px}
input[type=range]{width:100%;height:28px}
input[type=range]:focus-visible,input[type=number]:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.rangeLab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.stats{display:flex;flex-wrap:wrap;gap:8px 24px;grid-column:1/-1;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-mono);font-weight:600;font-size:15px}
.stat span{font-size:12px;color:var(--muted)}
.model{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;font-size:13px;color:var(--fg2)}
.model input{width:64px;font:inherit;font-family:var(--f-mono);padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.pubbar{flex-basis:100%;order:9;font-size:12.5px;color:var(--fg2);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.live{grid-column:1/-1;border-top:1px solid var(--grid);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.liveHead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.lst{font-size:12px;color:var(--muted)}
.liveForm{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px;color:var(--fg2)}
.liveForm input{font:inherit;font-family:var(--f-mono);padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.liveForm input[type=number]{width:6em}
.btn{font:inherit;font-weight:600;font-size:13px;padding:4px 12px;border-radius:6px;border:1px solid var(--fg);background:var(--fg);color:var(--panel);cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg2);border-color:var(--line)}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.chip button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.lerr{color:var(--warn);font-size:12px}
.focus{border:1px solid var(--line);border-left:5px solid var(--cc);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.focus .fh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.focus .fn{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.focus .fsub{font-size:12px;color:var(--muted)}
.focus .fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px 16px}
.focus .fv{display:flex;flex-direction:column;min-width:0}
.focus .fv b{font-family:var(--f-mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.focus .fv b.big{font-size:20px;color:var(--cc)}
.focus .fv span{font-size:12px;color:var(--muted)}
.focus details.nut{border-top:1px dashed var(--grid);padding-top:6px}
.focus details.nut summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--fg);list-style-position:inside}
.focus details.nut summary:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:4px}
.nutT{font-size:12px;color:var(--fg2);margin:6px 0 4px}
.nutG{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px 18px;margin:4px 0}
.nutG h4{margin:0 0 2px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.nutG ul{margin:0;padding-left:16px;font-size:13px;line-height:1.45}
.nutN{font-size:11.5px;color:var(--muted);margin-top:4px}
.focus .fthen{font-size:12.5px;color:var(--fg2);border-top:1px dashed var(--grid);padding-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 4px 2px 9px;border:1px solid var(--line);border-radius:999px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.chip button{border:0;background:transparent;color:var(--fg2);cursor:pointer;font-size:14px;line-height:1;padding:2px 5px;border-radius:50%}
.chips .hint{color:var(--muted);font-size:12px}
.chart-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline;margin-bottom:6px}
.chart-head h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--fg2);align-items:center}
.legend i{display:inline-block;width:22px;height:0;border-top:2.5px solid;vertical-align:middle;margin-right:6px}
.legend i.grad{width:90px;height:8px;border:0;border-radius:4px;margin:0 4px;background:linear-gradient(90deg,#2fa36b,#e3b23c,#d9572b,#8e1b2b)}
.legend b.mono{font-family:var(--f-mono);font-weight:600;color:var(--fg)}
.cpill{display:inline-block;padding:0 7px;border-radius:999px;font-size:11.5px;font-weight:700;color:#fff;line-height:18px;font-family:var(--f-mono)}
.scroll{overflow-x:auto}
svg{display:block;font-family:var(--f-body)}
#main{touch-action:manipulation} /* kein Doppeltipp-Zoom des Browsers, Wischen und Seitenzoom bleiben */
.zoombar{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:4px 0 8px}
.zb{font:inherit;font-family:var(--f-mono);font-weight:600;font-size:14px;min-width:34px;height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.zb.wide{font-family:var(--f-body);font-size:13px}
.zb:disabled{opacity:.35;cursor:default}
.zb:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
/* Vollbild: echtes Vollbild, wo der Browser es erlaubt; sonst (z. B. iPhone) füllt das Diagramm das ganze Fenster */
#chartPanel:fullscreen{overflow:auto;border-radius:0;padding-block:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
#chartPanel:-webkit-full-screen{overflow:auto;border-radius:0;width:100%;height:100%}
#chartPanel.fs{position:fixed;inset:0;z-index:1000;margin:0;border-radius:0;border:0;overflow:auto;padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
body.fsLock{overflow:hidden}
#chartPanel:fullscreen .zoombar,#chartPanel.fs .zoombar{position:sticky;left:0;top:0;z-index:6;background:var(--panel);padding-block:4px}
.kmPin{display:inline-flex;align-items:center;gap:6px;margin-right:10px;font-size:13px;color:var(--fg2)}
.kmPin .zb{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.kmPin input{font:inherit;font-family:var(--f-mono);width:5.5em;height:32px;padding:0 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);text-align:right;box-sizing:border-box}
.kmPin input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.zrange{font-family:var(--f-mono);font-size:12px;color:var(--fg2)}
.zhint{font-size:12px;color:var(--muted)}
svg text{fill:var(--fg2);font-size:11px}
svg text.kmlabel{paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}
svg text.fglab{font-size:10.5px;font-weight:600;paint-order:stroke;stroke:var(--panel);stroke-width:3.5px;stroke-linejoin:round}
svg text.suplab{font-size:10.5px;font-weight:700;fill:var(--support);paint-order:stroke;stroke:var(--panel);stroke-width:3.5px;stroke-linejoin:round}
svg text.ptlab{font-size:10.5px;font-weight:700;paint-order:stroke;stroke:var(--panel);stroke-width:3.5px;stroke-linejoin:round}
.empty{padding:40px 12px;text-align:center;color:var(--fg2)}
.tip{position:absolute;pointer-events:none;background:var(--panel);background:color-mix(in srgb,var(--panel) 40%,transparent);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.4;box-shadow:0 4px 14px rgba(0,0,0,.12);font-variant-numeric:tabular-nums;white-space:nowrap;z-index:5}
.tip b{font-family:var(--f-mono)}
.tip .row+.row{margin-top:6px;padding-top:6px;border-top:1px solid var(--grid)}
.rel{position:relative}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.mono{font-family:var(--f-mono);font-size:13px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;font-family:var(--f-mono)}
.pill.ok{color:var(--ok);border:1px solid currentColor}
.pill.tight{color:var(--cut);border:1px solid currentColor}
.pill.out{color:#fff;background:var(--warn)}
.pill.sup{color:var(--support);border:1px solid currentColor;margin-left:6px;font-family:var(--f-body)}
.sup-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--support);vertical-align:middle;margin-right:5px}
.tin.fc{font-style:italic;color:var(--tc,var(--plan))} /* Prognose in Streckenfarbe */
.tin.ist{font-style:normal;color:var(--fg);font-weight:600}
.tin{font:inherit;font-family:var(--f-mono);font-size:13px;padding:1px 4px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);width:7.2em}
.lt{display:inline-block;width:1.4em;color:var(--fg2)}
#map{height:560px;border-radius:8px;border:1px solid var(--grid);background:var(--grid);overflow:hidden}
.maplibregl-map{font-family:var(--f-body)}
.maplibregl-popup.aid .maplibregl-popup-content{font-size:12px;line-height:1.35;color:#222;padding:6px 9px;font-variant-numeric:tabular-nums}
.maplibregl-popup.aid b{font-family:var(--f-mono)}
.aidm{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #1d2b22;cursor:pointer}
.aidm.sup{width:20px;height:20px;background:var(--support);border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.aidm .maplab{display:none}.aidm.sup .maplab{display:block}
.aidm .maplab.r{left:20px;top:-1px}.aidm .maplab.l{right:20px;top:-1px}
.posdot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);pointer-events:none}
/* Läufer (Prognose) und eigene/geteilte Standorte als Emoji */
.runner,.me{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;line-height:1;cursor:default}
.runner{border:3px solid var(--rc,#000);box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:3}
.me{z-index:4}
.maplibregl-ctrl-group button.fitall{width:auto;padding:0 10px;font:600 13px var(--f-body);color:#222;white-space:nowrap}
/* Livedaten-Eingabe: groß und orange, damit sie unterwegs gut zu treffen ist */
:root{--lv-bg:#fff3e6;--lv-bd:#ee7a14;--lv-fg:#8a3d00;--lv-btn:#e86f0c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--lv-bg:#3a230d;--lv-bd:#f5913a;--lv-fg:#ffc58f;--lv-btn:#e8700f}}
:root[data-theme="dark"]{--lv-bg:#3a230d;--lv-bd:#f5913a;--lv-fg:#ffc58f;--lv-btn:#e8700f}
.liveForm{font-size:15px;gap:10px 14px;padding:10px 12px;border-radius:10px;background:var(--lv-bg);border:1px solid var(--lv-bd);color:var(--lv-fg)}
.liveForm label{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.liveForm input{font-size:18px;min-height:44px;padding:6px 10px;border:2px solid var(--lv-bd);border-radius:8px;background:var(--panel)}
.liveForm input[type=number]{width:6.5em}
.liveForm input:focus-visible{outline:3px solid var(--lv-bd);outline-offset:2px}
.liveForm .btn{font-size:16px;min-height:44px;padding:8px 20px;border-radius:8px;background:var(--lv-btn);border-color:var(--lv-btn);color:#fff}
.liveForm .lerr{flex-basis:100%;font-size:13px}
.lerr:empty{display:none}
.tin:not(:disabled){font-size:15px;min-height:38px;padding:4px 6px;border:2px solid var(--lv-bd);border-radius:8px;background:var(--lv-bg);width:7.8em}
.tin:not(:disabled):focus-visible{outline:3px solid var(--lv-bd);outline-offset:1px}
.runner .maplab{left:38px;top:7px}
.me{border:2px solid #ff6a2a;box-shadow:0 0 0 4px rgba(255,106,42,.25),0 2px 6px rgba(0,0,0,.4)}
.me.other{border-color:#2a78d6;box-shadow:0 0 0 4px rgba(42,120,214,.25),0 2px 6px rgba(0,0,0,.4)}
.basesw{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.trailsw{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--fg2);cursor:pointer;margin-right:4px}
.trailsw input{width:16px;height:16px;accent-color:var(--fg)}
.basesw button[aria-pressed="true"]{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.locbar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:0 0 10px;font-size:13px;color:var(--fg2)}
.locgrp{display:inline-flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.locgrp label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.emob{font-size:20px;line-height:1;width:40px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;padding:0}
.emob[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg);background:var(--bg)}
.emob:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.kmlab{font-family:var(--f-mono);font-size:10px;font-weight:600;color:#1d2b22;background:rgba(255,255,255,.85);border:1px solid #1d2b22;border-radius:3px;padding:0 3px;white-space:nowrap;line-height:14px;text-align:center}
.maplab{position:absolute;color:#fff;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.maplab.r{left:14px;top:-10px}
.maplab.tl{right:10px;bottom:10px}
.mapnote,.note{font-size:13px;color:var(--fg2);max-width:85ch}
.mapnote{font-size:12px;color:var(--muted);margin-top:6px}
@media (max-width:640px){#map{height:440px}.goal{font-size:34px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
/* Startseite: nur ein Passwortfeld */
#gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px}
#gateForm{width:min(320px,100%)}
#gateIn{display:block;width:100%;font:inherit;font-size:18px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);text-align:center}
#gateIn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
#gateIn.bad{border-color:var(--warn);animation:gateShake .3s}
@keyframes gateShake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* Kopfzeile: Sprache und Bearbeitungssperre */
.hctl{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.lock .ico{color:var(--fg);font-size:14px}
#lockSw[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
#lockLbl{min-width:7ch}
input:disabled{opacity:.55;cursor:not-allowed}
/* Passwortdialog */
#pwDlg{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);padding:20px 22px;width:min(420px,calc(100vw - 32px));box-shadow:0 12px 40px rgba(0,0,0,.25)}
#pwDlg::backdrop{background:rgba(0,0,0,.4)}
#pwDlg h2{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0 0 6px}
#pwDlg p{margin:0 0 14px;color:var(--fg2);font-size:14px}
#pwDlg label{display:block;font-weight:600;margin-bottom:4px}
#pwIn{width:100%;font:inherit;font-size:16px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
#pwIn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.pwErr{min-height:1.4em;margin:6px 0 10px;font-size:13px;color:var(--warn)}
.pwBtns{display:flex;justify-content:flex-end;gap:8px}
.pwBtns .btn{font-size:14px;padding:6px 14px}
@media (max-width:640px){.hctl{flex-direction:row;align-items:center;gap:16px;flex-wrap:wrap}}
</style>
</head>
<body>

<div id="gate"><form id="gateForm"><input type="password" id="gateIn" aria-label="Passwort / Wachtwoord" autocomplete="current-password" required></form></div>

<div class="wrap" hidden>
  <header>
    <div>
      <div class="eyebrow" data-i="eyebrow"></div>
      <h1 data-i="h1"></h1>
      <p class="sub" data-i="sub"></p>
    </div>
    <div class="hctl">
      <div class="lang"><span id="lDE">DE</span><button class="switch" id="langSw" role="switch" aria-checked="false" aria-label="Deutsch / Nederlands"></button><span id="lNL">NL</span></div>
      <div class="lang lock"><span class="ico" id="lockIco" aria-hidden="true">🔒</span><button class="switch" id="lockSw" role="switch" aria-checked="false"></button><span id="lockLbl"></span></div>
    </div>
  </header>

  <section class="panel courses" aria-label="Strecken">
    <span class="eyebrow" data-i="courses"></span>
    <label for="on-sdt"><input type="checkbox" id="on-sdt" checked><span class="cdot" style="background:var(--c-sdt)"></span><span>100 Miles Serra de Tramuntana (SDT) · 138,4 km</span></label>
    <label for="on-etm"><input type="checkbox" id="on-etm" checked><span class="cdot" style="background:var(--c-etm)"></span><span>Els Tres Mils (ETM) · 55,9 km</span></label>
  </section>

  <div class="controls" id="controls"></div>

  <section class="panel model" aria-label="Modell">
    <span class="eyebrow" data-i="model"></span>
    <label for="fUp"><span data-i="mUp1"></span> <input type="number" id="fUp" min="50" max="200" step="5" value="100"> <span data-i="mUp2"></span></label>
    <label for="fDown"><span data-i="mDn1"></span> <input type="number" id="fDown" min="100" max="2000" step="50" value="500"> <span data-i="mDn2"></span></label>
    <label for="fFat"><span data-i="mFat"></span> <input type="number" id="fFat" min="0" max="150" step="5" value="50"> %</label>
  </section>

  <section class="panel" id="chartPanel">
    <div class="chart-head">
      <h2 data-i="chart"></h2>
      <div class="legend" id="legend"></div>
    </div>
    <div class="zoombar"><span class="kmPin" id="kmBar"><label for="kmIn" id="kmLbl"></label><button type="button" class="zb" id="kmM" aria-label="−1 km">−</button><input type="number" id="kmIn" min="0" step="1" inputmode="decimal" placeholder="–"><button type="button" class="zb" id="kmP" aria-label="+1 km">+</button><button type="button" class="zb" id="kmX">✕</button></span><button type="button" class="zb wide" id="fsBtn"></button></div>
    <div class="scroll"><div class="rel" id="mainWrap" style="min-width:720px"><svg id="main" viewBox="0 0 1100 800" width="100%" role="img"></svg><div class="tip" id="tip" hidden></div></div></div>
    <p class="mapnote" id="etmNote" data-i="etmNote"></p>
  </section>

  <section class="panel">
    <div class="chart-head">
      <h2 data-i="map"></h2>
      <div class="basesw"><label class="trailsw" for="trailsOn"><input type="checkbox" id="trailsOn"><span data-i="mapTrails"></span></label><div class="basesw" id="baseSw" role="group" aria-label="Kartenstil"><button type="button" class="zb wide" data-b="topo" data-i="mapTopo"></button><button type="button" class="zb wide" data-b="sat" data-i="mapSat"></button></div></div>
    </div>
    <div class="legend" id="mapLegend" style="margin-bottom:10px"></div>
    <div class="locbar" id="locBar" hidden>
      <button type="button" class="btn" id="locBtn"></button>
      <span class="locgrp" id="locEmo" role="group"><span data-i="locAs"></span><button type="button" class="emob" data-e="koala">🐨</button><button type="button" class="emob" data-e="pig">🐷</button><button type="button" class="emob" data-e="dog">🐕‍🦺</button></span>
      <span class="locgrp" role="radiogroup"><label><input type="radio" name="locShare" value="0"><span data-i="locPriv"></span></label><label><input type="radio" name="locShare" value="1"><span data-i="locPub"></span></label></span>
      <span class="lst" id="locSt" role="status"></span>
    </div>
    <div id="map" role="region" aria-label="3D-Karte"></div>
    <div class="mapnote" data-i="mapNote"></div>
  </section>

  <div id="tables" style="display:flex;flex-direction:column;gap:20px"></div>

  <p class="note" data-i="note"></p>
</div>

<dialog id="pwDlg" aria-labelledby="pwH">
  <form id="pwForm">
    <h2 id="pwH" data-i="pwTitle"></h2>
    <p data-i="pwText"></p>
    <label for="pwIn" data-i="pwLabel"></label>
    <input type="password" id="pwIn" autocomplete="current-password" required>
    <div class="pwErr" id="pwErr" role="alert"></div>
    <div class="pwBtns"><button type="button" class="btn ghost" id="pwCancel" data-i="pwCancel"></button><button type="submit" class="btn" id="pwOk" data-i="pwOk"></button></div>
  </form>
</dialog>

  if(DB){const r=await fetch(DB_ROOT+".json?print=silent",{method:"PATCH",body:JSON.stringify({key:{pw,at:{".sv":"timestamp"}}})});
    if(r.ok)return true;if(r.status===401||r.status===403)return false;throw new Error(r.status)}
  const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(pw));
  return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("")===PW_HASH}
function setLock(v){LOCKED=RO=v;if(v){stopLoc();PW=null;try{localStorage.removeItem("pr-pw")}catch(e){}}render()}
function syncLock(){
  const sw=$("lockSw");sw.setAttribute("aria-checked",!LOCKED);sw.setAttribute("aria-label",t("lockAria"));
  $("lockLbl").textContent=t(LOCKED?"lockOff":"lockOn");$("lockIco").textContent=LOCKED?"🔒":"🔓";
  ["fUp","fDown","fFat"].forEach(id=>$(id).disabled=RO);
  COURSES.forEach(c=>{const s=$("ctl-"+c.id);s&&s.querySelectorAll(".goalSteps button,input[type=range],.goalIn").forEach(x=>x.disabled=RO)});
  syncLoc();
}
$("lockSw").addEventListener("click",()=>{if(!LOCKED){setLock(true);return}
  $("pwIn").value="";$("pwErr").textContent="";$("pwOk").disabled=false;$("pwDlg").showModal();$("pwIn").focus()});
$("pwCancel").addEventListener("click",()=>$("pwDlg").close());
$("pwForm").addEventListener("submit",async e=>{e.preventDefault();const pw=$("pwIn").value,ok=$("pwOk");if(!pw)return;
  ok.disabled=true;$("pwErr").textContent=t("pwCheck");let good=false;
  try{good=await checkPw(pw)}catch(x){$("pwErr").textContent=t("pwNet");ok.disabled=false;return}
  ok.disabled=false;if(!good){$("pwErr").textContent=t("pwWrong");$("pwIn").select();return}
  PW=pw;try{localStorage.setItem("pr-pw",pw)}catch(x){}$("pwDlg").close();setLock(false)});
// geschätzte aktuelle Position (Rennzeit MEZ)
function kmAtTime(c,tt){const P=c.pts;if(tt<P[0].t||tt>P[P.length-1].t)return null;for(let i=1;i<P.length;i++)if(tt<=P[i].t){const a=P[i-1],b=P[i];return a.km+(tt-a.t)/((b.t-a.t)||1)*(b.km-a.km)}return null}
let nowMarks={};
function updateNow(){if(!map)return;const nowL=nowLocal();
  COURSES.forEach(c=>{const k=c.on&&c.pts?kmAtTime(c,nowL):null;
    if(k==null){nowMarks[c.id]&&nowMarks[c.id].remove();return}
    if(!nowMarks[c.id]){const e=divEl("runner",`${RUNNER[c.id]}<span class="maplab r"></span>`);e.style.setProperty("--rc",cvar(c));e.querySelector(".maplab").style.background=cvar(c);
      nowMarks[c.id]=new maplibregl.Marker({element:e,anchor:"center"})}
    const e=nowMarks[c.id].getElement(),lab=c.short+" · "+t("posNow",kmf(k));e.querySelector(".maplab").textContent=lab;e.title=lab+" ("+t("forecast")+")";
    nowMarks[c.id].setLngLat(LL(posAt(c,k))).addTo(map)})}
// Uhrzeitfeld der Livedaten folgt der aktuellen Zeit (Mallorca, MEZ), solange es nicht von Hand geändert wurde
function nowHM(){return clock(nowLocal())}
setInterval(()=>{COURSES.forEach(c=>{const ti=$("lt-"+c.id);if(ti&&!ti.dataset.edited&&document.activeElement!==ti)ti.value=nowHM()})},20000);
setInterval(()=>{COURSES.forEach(c=>c.on&&c.pts&&renderFocus(c))},60000);
setInterval(()=>{const nowL=nowLocal();if(!STARTED||document.hidden||nowL<T0-H||nowL>T1+H)return;drawChart();updateNow()},60000);

// ---------- Gesamtablauf
function render(){
  const fUp=Math.max(20,+$("fUp").value||100),fDown=Math.max(50,+$("fDown").value||500),fat=Math.max(0,+$("fFat").value||0)/100;
  const on=COURSES.filter(c=>c.on);on.forEach(c=>compute(c,fUp,fDown,fat));
  const all=on.flatMap(c=>c.segs.filter(s=>s.len>=.9).map(s=>s.pace)).sort((a,b)=>a-b);
  if(all.length){pLo=all[Math.floor(all.length*.05)];pHi=all[Math.floor(all.length*.95)]}
  COURSES.forEach(c=>{const s=$("ctl-"+c.id);if(s)s.hidden=!c.on;updateStats(c)});
  drawChart();buildLegends();buildTables();updateMapTips();updateNow();COURSES.forEach(c=>c.on&&renderLive(c));if(PIN==null)$("tip").hidden=true;else showPinned();
  syncLock();
}
COURSES.forEach(c=>{const cb=$("on-"+c.id);cb.checked=c.on;cb.addEventListener("change",()=>{c.on=cb.checked;
  try{localStorage.setItem("pr-on",JSON.stringify(Object.fromEntries(COURSES.map(x=>[x.id,x.on]))))}catch(e){}
  render();updateMapVisibility(true)})});
["fUp","fDown","fFat"].forEach(id=>{$(id).addEventListener("input",render);$(id).addEventListener("change",saveModel)});
// ---------- Startseite: der Pacerechner startet erst nach dem Seitenpasswort (SHA-256, Prüfung im Browser); der Browser merkt sich die Freigabe
const GATE_HASH="0ae2f6c706cff60bff7c0125b99cae8c53e1a1702f02316848bc99e597d084db";
let STARTED=false;
function startApp(){
  if(STARTED)return;STARTED=true;$("gate").remove();document.querySelector(".wrap").hidden=false;
  applyLang();
  initMap();
  initLive();
  // km des Infofensters pro Browser merken
  try{const v=localStorage.getItem("pr-pin");if(v!=null&&v!==""&&!isNaN(+v))setPin(+v)}catch(e){}
}
$("gateForm").addEventListener("submit",async e=>{e.preventDefault();const inp=$("gateIn");let h="";
  try{const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(inp.value));h=[...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,"0")).join("")}catch(x){}
  if(h===GATE_HASH){try{localStorage.setItem("pr-gate",h)}catch(x){}startApp();return}
  inp.classList.remove("bad");void inp.offsetWidth;inp.classList.add("bad");inp.select()});
let gateOk=false;try{gateOk=localStorage.getItem("pr-gate")===GATE_HASH}catch(e){}
if(gateOk)startApp();else $("gateIn").focus();
</script>
</body>
